<div>
  <app-layout-page>
    <div titulo>
      <h2>Gestión de Sucursales</h2>
    </div>
    <div filtros>
      <div>
        <app-filtro
          [companias]="companias"
          [sucursales]="sucursales"
          (seleccionarCompania)="seleccionarCompania($event)"
          (seleccionarSucursal)="seleccionarSucursal($event)"
        />
      </div>
    </div>
    <div tabla>
      <div>
        <app-tabla [headers]="headers" [data]="data">
          <ng-template #nombreTemplate let-item>
            <span>{{ item.nombre }}</span>
          </ng-template>
        </app-tabla>
      </div>
    </div>
  </app-layout-page>
</div>
